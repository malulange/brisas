# Visita o banco a cada 3 dias para o Supabase gratuito não pausar o projeto.
# Usa a mesma URL e a mesma chave pública que já estão no index.html.
name: Manter as brisas acordadas

on:
  schedule:
    - cron: "17 11 */3 * *"
  workflow_dispatch:

jobs:
  visitar:
    runs-on: ubuntu-latest
    steps:
      - name: Ler uma pergunta
        run: |
          URL="https://ceyhuvnzzcognplujocx.supabase.co"
          KEY="sb_publishable_8oH5NYqpnXNUhNowmhJ5BQ_KitjyYsh"
          CODIGO=$(curl -sS -o resposta.txt -w "%{http_code}" "$URL/rest/v1/perguntas?select=id&limit=1" -H "apikey: $KEY" || true)
          echo "Resposta do Supabase: $CODIGO"
          cat resposta.txt 2>/dev/null; echo
          if [ "$CODIGO" != "200" ]; then echo "ERRO: o Supabase não respondeu como esperado"; exit 1; fi
          echo "Tudo certo: as brisas estão acordadas ✦"
